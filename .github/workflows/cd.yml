name: CD (design — not active)

on:
  push:
    branches: [main]

# This workflow verifies that the repo is production-build ready. It does
# NOT deploy. Production CD to Vercel and Render is designed here but remains
# inactive until the providers are connected, configured, and tested in
# Phase 16. No secrets, deploy keys, or provider credentials are referenced.
jobs:
  verify-production-build:
    name: Verify production build (CD readiness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production builds (deployability check)
        run: pnpm build

      - name: CD status
        run: |
          echo "Production CD is designed but NOT active."
          echo "Vercel and Render providers are not yet connected or tested."
          echo "No deployment was performed in this run."
          echo "See GitHub Issue #24 Phase 16 for production deployment gates."

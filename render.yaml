services:
  - type: web
    name: snapprint
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://snap.palnadu.dev,https://snapprint.onrender.com
      - key: TRUST_PROXY
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: snapprint
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
